name: Build reaction-wheel GIF preview

on:
  push:
    paths:
      - evidence/videos/bench-operation.mp4
      - evidence/videos/short-operation.mp4
      - .github/workflows/generate-demo-gif.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract looping preview from both bench clips
        shell: bash
        run: |
          filter='[0:v]trim=start=0.6:duration=3.4,setpts=PTS-STARTPTS,crop=442:674:20:100,scale=300:-2:flags=lanczos,setsar=1,fps=9[a];'
          filter+='[1:v]trim=start=1.2:duration=2.9,setpts=PTS-STARTPTS,crop=442:674:20:100,scale=300:-2:flags=lanczos,setsar=1,fps=9[b];'
          filter+='[a][b]concat=n=2:v=1:a=0,split[frames][colors];[colors]palettegen=max_colors=72:stats_mode=diff[palette];'
          filter+='[frames][palette]paletteuse=dither=bayer:bayer_scale=5:diff_mode=rectangle[out]'
          ffmpeg -hide_banner -loglevel error -y \
            -i evidence/videos/bench-operation.mp4 \
            -i evidence/videos/short-operation.mp4 \
            -filter_complex "$filter" -map '[out]' -an -loop 0 \
            evidence/videos/reaction-wheel-demo.gif
          test -s evidence/videos/reaction-wheel-demo.gif

      - name: Commit generated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/videos/reaction-wheel-demo.gif
          if ! git diff --cached --quiet; then
            git commit -m "Add real GIF preview from physical bench video"
            git push
          fi
